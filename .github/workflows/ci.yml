name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      HUNTEROS_NO_UPDATE_CHECK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      # tests/ ships untracked in v0.5, so every check degrades gracefully
      # when the directory is absent. shell: bash keeps one syntax across the
      # ubuntu/windows runners (the windows default is pwsh).
      - name: Ruff
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m ruff check src scripts tests
          else
            python -m ruff check src scripts
          fi
      - name: Pytest
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "tests/ absent; skipping"
          fi
