[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunteros-harness"
version = "0.6.0"
description = "HunterOs — evidence-first security-audit harness. Deterministic engine today, pluggable LLM brain tomorrow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HunterOs Contributors" }]
keywords = ["security", "audit", "harness", "llm", "vulnerability"]
dependencies = [
    "typer>=0.12",
    # handle.py uses click directly (Command.main non-standalone, Abort/
    # ClickException, PacifyFlushWrapper). typer >=0.26 no longer depends on
    # click, so it must be declared, not inherited.
    "click>=8.1",
    "rich>=13.0",
    "textual>=0.86",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # The brain ships with the body: litellm is the provider seam every
    # agent path rides on. The API key stays BYOK; the interface is core.
    "litellm>=1.40",
]

[project.optional-dependencies]
# Kept as aliases: `llm` is now part of the core install.
llm = ["litellm>=1.40"]
telegram = ["python-telegram-bot>=21"]
discord = ["discord.py>=2.3"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
hunter = "hunter.cli.main:main"
hunt = "hunter.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hunter = ["_data/**/*.md", "_data/**/*.jinja", "_data/**/*.j2", "_data/**/*.yaml", "vault/*.json"]

# Release-artifact hygiene: the source distribution must never carry the local
# development kitchen (tests, plans, caches, or user state). The wheel already
# excludes them by virtue of packages.find; this keeps the sdist equally clean.
[tool.setuptools.exclude-package-data]
"*" = ["tests/*", "docs/plans/*", ".hunter/*", ".hunteros/*", "**/__pycache__/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer/click apps construct Option/Argument defaults in signatures (B008).
"src/hunter/cli/main.py" = ["B008", "E501"]
"src/hunter/cli/config_cmd.py" = ["B008", "E501"]
"src/hunter/cli/daemon.py" = ["B008", "E501"]
"src/hunter/cli/model_cmd.py" = ["B008", "E501"]
"src/hunter/agent/skills.py" = ["E501", "SIM"]
"src/hunter/agent/curator.py" = ["E501"]
"src/hunter/chat/commands.py" = ["E501"]
"tests/*.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
