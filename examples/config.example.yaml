# HunterOs LLM configuration — copy to ~/.hunter/config.yaml
# Any provider reachable through LiteLLM works: set a key env var and a model.
# Every value here can be overridden per-run with env vars:
#   HUNTEROS_MODEL, HUNTEROS_TIER, HUNTEROS_BUDGET_USD, HUNTEROS_MAX_ITERATIONS

# This example mirrors a 2-provider setup (openai-compatible gateway + failover).
# Pin every tier to the SAME brain when provider credit is concentrated on one
# model: a mismatched per-tier model is the usual cause of a run dying halfway
# with a 404 on the verifier while the orchestrator still works.

model_tiers:
  orchestrator:                # task decomposition — the "top default" model
    provider: anthropic        # auto | openai | anthropic | openrouter | groq | gemini | ollama | ...
    model: claude-sonnet-4-5   # empty or "auto" inherits $HUNTEROS_MODEL
    # base_url: https://internal-gateway.example.com/v1
    # key_env: ANTHROPIC_API_KEY
    timeout: 120               # seconds per completion
    # reasoning_effort: medium # low | medium | high (models that support it)

  hunter:                      # payload/craft tier — inherits orchestrator unless set
    provider: auto
    model: ""

  verifier:                    # evidence checking — a cheap, careful model
    provider: auto
    model: ""

  utility:                     # summarizing/formatting — cheapest model
    provider: auto
    model: ""

providers:                     # credentials per provider name
  anthropic:
    key_env: ANTHROPIC_API_KEY # env var is preferred over inline api_key
  openai:
    key_env: OPENAI_API_KEY
# OpenAI-compatible gateways: declare base_url plus a key_env indirection, and
# keep the key in a chmod 600 env file next to the ledger (never inline here).
#   nostate:
#     base_url: https://gateway.example.com/v1
#     key_env: HUNTER_NOSTATE_KEY
# Keyless providers (e.g. ollama) get NO block here at all:
#   local:
#     base_url: http://127.0.0.1:11434   (set on the tier, not the provider)
# `endpoint` records the API shape (chat is the default):
#   mygateway:
#     base_url: https://llm.corp.example.com/v1
#     endpoint: responses

# Tried in order when the primary provider fails with auth/billing/404-class
# errors (deduped against the primary by provider+model+base_url).
# Each entry needs BOTH provider and model — a bare provider string is rejected
# by config validation (`fallback_providers[0] needs both 'provider' and ...`).
fallback_providers: []
#  - provider: openrouter
#    model: anthropic/claude-sonnet-4.5
#    key_env: OPENROUTER_API_KEY

budget:                        # per-run governor (RunBudget)
  max_cost_usd: 5.0            # hard spend cap; warnings at 70/85/95%
  max_iterations: 60           # agent tool-loop turns
  wall_seconds: 1800           # 30 minute wall clock
  min_wall_seconds: 0          # minimum-time floor: the engine keeps hunting
                               # until at least this much wall time elapsed
# 0 = unlimited (unlimited hunting credit) — applies to max_cost_usd,
# max_iterations, wall_seconds, and min_wall_seconds alike.

agent:
  tier: basic                  # basic | advanced | orchestrator | hunter | verifier | utility
  api_max_retries: 3           # attempts per provider before failing over
